name: Kindle Legacy Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-build:
    name: Reference ARM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Setup
        uses: actions/setup-go@v6
        with:
          go-version-file: kron/go.mod

      - name: Build Runtime Probe
        run: |
          mkdir -p probe
          cd probe
          go mod init probe

          cat > main.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "time"
          )

          func main() {
              fmt.Println("probe: start")
              fmt.Println("probe: args", os.Args)
              fmt.Println("probe: time", time.Now())
              fmt.Println("probe: done")
          }
          EOF

          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -o ../probe-arm .

      - name: Upload Probe
        uses: actions/upload-artifact@v4
        with:
          name: kindle-runtime-probe
          path: probe-arm
          if-no-files-found: error
          retention-days: 14

      - name: Dependencies
        working-directory: kron
        run: go mod download

      - name: Tests
        working-directory: kron
        run: go test ./...

      - name: Build Reference
        working-directory: kron
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/kron-reference .

      - name: Collect diagnostics
        run: |
          go version
          file dist/kron-reference
          sha256sum dist/kron-reference

      - name: Upload Reference
        uses: actions/upload-artifact@v4
        with:
          name: kindlecron-reference-arm
          path: dist/kron-reference
          if-no-files-found: error
          retention-days: 14

name: Kindle Legacy Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-build:
    name: Reference ARM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go Setup (Legacy Probe)
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.13'
      
      - name: Build Filesystem Probe
        working-directory: probe
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -o ../probe-fs .
      
      - name: Verify Filesystem Probe
        run: |
          test -f probe-fs
          file probe-fs
          sha256sum probe-fs
      
      - name: Upload Filesystem Probe
        uses: actions/upload-artifact@v4
        with:
          name: kindle-filesystem-probe
          path: probe-fs
          if-no-files-found: error
          retention-days: 14

      - name: Prepare KindleCron compatibility copy
        run: |
          cp -a kron kron-compat
          sed -i 's/^go 1\.26$/go 1.21/' kron-compat/go.mod
          grep -n '^go ' kron-compat/go.mod

      - name: Inspect kindle-utils dependency
        working-directory: kron-compat
        run: |
          echo "=== Dependency declaration ==="
          grep -n -A4 -B2 'kindle-utils' go.mod go.sum || true
      
          echo "=== Direct imports ==="
          grep -R -n 'github.com/lennardollesch/kindle-utils' \
            --include='*.go' .

      - name: Inspect KindleCron imports
        working-directory: kron-compat
        run: |
          echo "=== kindle-utils imports ==="
          grep -R -n -E 'kindle-utils|kindle_utils' \
            --include='*.go' .
      
          echo "=== Dependency declaration ==="
          grep -n -A5 -B2 'kindle-utils' go.mod
      
          echo "=== All Go imports ==="
          grep -R -n '"github.com/lennardollesch' \
            --include='*.go' .

      - name: Build KindleCron Go 1.21 test
        working-directory: kron-compat
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -o ../dist/kron-121 .

      - name: Verify KindleCron Go 1.21 test
        run: |
          test -f dist/kron-121
          file dist/kron-121
          sha256sum dist/kron-121

      - name: Go Setup (KindleCron)
        uses: actions/setup-go@v6
        with:
          go-version-file: kron/go.mod

      # Download dependencies and run tests
      - name: Dependencies
        working-directory: kron
        run: go mod download

      - name: Tests
        working-directory: kron
        run: go test ./...

      # Build reference KindleCron ARM binary
      - name: Build Reference
        working-directory: kron
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/kron-reference .

      - name: Collect diagnostics
        run: |
          go version
          file dist/kron-reference
          sha256sum dist/kron-reference

      - name: Upload Reference
        uses: actions/upload-artifact@v4
        with:
          name: kindlecron-reference-arm
          path: dist/kron-reference
          if-no-files-found: error
          retention-days: 14

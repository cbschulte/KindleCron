name: Kindle Legacy Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-build:
    name: Reference ARM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Filesystem-Probe mit bewährter Go-Version
      - name: Go Setup (Legacy Probe)
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.13'

      - name: Build Filesystem Probe
        working-directory: probe
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -o ../probe-fs .

      - name: Verify Filesystem Probe
        run: |
          test -f probe-fs
          file probe-fs
          sha256sum probe-fs

      - name: Upload Filesystem Probe
        uses: actions/upload-artifact@v4
        with:
          name: kindle-filesystem-probe
          path: probe-fs
          if-no-files-found: error
          retention-days: 14

      # 2. Temporäre KindleCron-Kopie erstellen
      - name: Prepare KindleCron compatibility copy
        run: |
          set -eu
          cp -a kron kron-compat

          echo "=== Original go.mod ==="
          cat kron/go.mod

          echo "=== Compatibility go.mod before ==="
          cat kron-compat/go.mod

          sed -i 's/^go 1\.26$/go 1.21/' kron-compat/go.mod

          echo "=== Compatibility go.mod after ==="
          cat kron-compat/go.mod

          test -f kron-compat/cli.go
          test -f kron-compat/go.mod

      # 3. Import und Funktionsverwendung untersuchen
      - name: Inspect KindleCron compatibility copy
        working-directory: kron-compat
        shell: bash
        run: |
          echo "=== Working directory ==="
          pwd
          echo

          echo "=== Files ==="
          ls -la
          echo

          echo "=== Go module ==="
          cat go.mod
          echo

          echo "=== kindle-utils imports ==="
          grep -R -n \
            'github.com/lennardollesch/kindle-utils' \
            --include='*.go' . || true
          echo

          echo "=== cli.go, first 120 lines ==="
          sed -n '1,120p' cli.go
          echo

          echo "=== drawOnScreen references ==="
          grep -n -A35 -B8 \
            'drawOnScreen' cli.go || true
          echo

          echo "=== eips references ==="
          grep -n -A8 -B8 \
            'eips\.' cli.go || true

      - name: Remove obsolete compatibility dependency
        working-directory: kron-compat
        shell: bash
        run: |
          echo "=== Remove kindle-utils ==="
          go mod edit -droprequire=github.com/lennardollesch/kindle-utils

          echo "=== Updated go.mod ==="
          cat go.mod

          echo "=== Tidy dependencies ==="
          go mod tidy

          echo "=== Final go.mod ==="
          cat go.mod

      - name: Test KindleCron compatibility build
        working-directory: kron-compat
        shell: bash
        run: |
          echo "=== Go version ==="
          go version
          echo

          echo "=== Module dependencies ==="
          go mod download
          echo

          echo "=== Tests ==="
          go test ./...
          echo

          echo "=== ARMv5 build ==="
          mkdir -p ../compat-output
          GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 \
            go build -o ../compat-output/kron .
          echo

          echo "=== Binary info ==="
          file ../compat-output/kron
          ls -lh ../compat-output/kron

      # 4. Unveränderten Referenz-Build vorbereiten
      - name: Go Setup (KindleCron Reference)
        uses: actions/setup-go@v6
        with:
          go-version-file: kron/go.mod

      - name: Dependencies
        working-directory: kron
        run: go mod download

      - name: Tests
        working-directory: kron
        run: go test ./...

      - name: Build Reference
        working-directory: kron
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/kron-reference .

      - name: Collect diagnostics
        run: |
          go version
          file dist/kron-reference
          sha256sum dist/kron-reference

      - name: Upload Reference
        uses: actions/upload-artifact@v4
        with:
          name: kindlecron-reference-arm
          path: dist/kron-reference
          if-no-files-found: error
          retention-days: 14
